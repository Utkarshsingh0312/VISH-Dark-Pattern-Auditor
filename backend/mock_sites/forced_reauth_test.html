<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISH Test - Forced Re-auth Flow</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .card { background: #151d2f; border: 1px solid #23324d; border-radius: 12px; padding: 32px; width: 100%; max-width: 540px; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
    h1 { font-size: 22px; color: #f8fafc; margin-top: 0; margin-bottom: 8px; font-weight: 700; }
    .order-summary { background: #1e293b; border-radius: 8px; padding: 16px; margin: 16px 0; border: 1px solid #334155; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    .summary-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; border-top: 1px solid #475569; padding-top: 8px; margin-top: 8px; color: #f8fafc; }
    .reauth-box { background: rgba(245, 158, 11, 0.1); border: 2px solid #f59e0b; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .reauth-title { font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 6px; }
    .reauth-desc { font-size: 13px; color: #e2e8f0; line-height: 1.5; margin-bottom: 14px; }
    .input-label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-field { width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 14px; margin-bottom: 14px; }
    .btn-verify { background: #f59e0b; color: #0f172a; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Review and Confirm Order</h1>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">Final Confirmation Stage</p>
    
    <!-- Cost Already Displayed and Confirmed -->
    <div class="order-summary">
      <div class="summary-row">
        <span>Cloud Storage Pro (Annual Plan)</span>
        <span>$39.99</span>
      </div>
      <div class="summary-total">
        <span>Total Confirmed Cost:</span>
        <span style="color: #38bdf8;">$39.99</span>
      </div>
    </div>

    <!-- The Intentionally Injected VISH Dark Pattern: Forced Re-auth -->
    <div class="reauth-box">
      <div class="reauth-title">Mandatory Security Verification</div>
      <div class="reauth-desc">
        Password re-entry required after order total is confirmed. You must re-enter your account password to proceed with this $39.99 purchase.
      </div>
      <label class="input-label" for="reauth-pass">Account Password:</label>
      <input type="password" id="reauth-pass" class="input-field" placeholder="••••••••••••" value="demo_password" readonly />
      <button class="btn-verify" id="reauth-btn">Confirm Password and Proceed</button>
    </div>
  </div>
</body>
</html>
