<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification | Cloudflare</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .challenge-box {
      background: #151d2f;
      border: 1px solid #23324d;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .cf-turnstile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      cursor: pointer;
    }
    .checkbox-mock {
      width: 24px;
      height: 24px;
      border: 2px solid #64748b;
      border-radius: 4px;
      background: #0f172a;
    }
    .ray-id {
      font-size: 11px;
      color: #64748b;
      font-family: monospace;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="challenge-box" id="challenge-stage">
    <h1>Verify you are human</h1>
    <p>Please complete this security check to access the requested page. We need to verify that you are not an automated bot.</p>
    
    <div class="cf-turnstile" id="cf-challenge-running">
      <div class="checkbox-mock"></div>
      <span style="font-size: 14px; font-weight: 500;">Verify you are human</span>
      <span style="margin-left: auto; font-size: 11px; color: #f59e0b;">Cloudflare</span>
    </div>

    <div class="ray-id">
      Ray ID: 88f2910a7bc4190e • IP: 192.0.2.1 • Performance & security by Cloudflare
    </div>
  </div>
</body>
</html>
